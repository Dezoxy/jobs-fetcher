name: Automatic refresh release

# Every merge to main that changes what the image ships is released as the next
# CalVer version (vYYYY.M.N) and pushed to GHCR as :YYYY.M.N. Deployment is NOT
# part of this workflow: Renovate notices the new tag, opens a PR bumping
# infra/azure/image.auto.tfvars.json (image_version + digest), automerges it once
# CI is green, and that push to main runs azure-deploy.yml, whose guard accepts
# only an image-only plan and waits for idle jobs. The pin file is outside the
# path filter below, so a pin bump never cuts a release.
#
# Batching: a push waits 30 minutes in the `release-batch` environment (a
# wait timer, which uses no runner minutes) before anything else runs. A newer
# push cancels the waiting one, so merges less than 30 minutes apart become
# ONE release of the newest commit, and one deploy. Only the wait is
# cancellable: once validation starts, the run finishes, and a merge that lands
# meanwhile starts its own window. workflow_dispatch skips the wait (urgent
# release of the latest main).

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/**'
      - 'runtime/**'
      - 'docs/judge-prompt.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debounce:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-batch
    concurrency:
      group: jobs-fetcher-auto-release-debounce
      cancel-in-progress: true
    steps:
      - run: echo "No newer merge within the batch window; releasing $GITHUB_SHA."

  validate:
    needs: debounce
    # Runs after the window, or at once for workflow_dispatch (debounce skipped).
    # A cancelled window (a newer push took over) skips the rest of this run.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.debounce.result == 'success' || needs.debounce.result == 'skipped')
    concurrency:
      group: jobs-fetcher-auto-release-build
      cancel-in-progress: false
    uses: ./.github/workflows/azure-application.yml

  tag:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: jobs-fetcher-auto-release-tag
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create or reuse this commit's CalVer release (vYYYY.M.N)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin --tags
          # Reuse the tag on a retry, including a previously failed image build.
          tag=$(git tag --points-at "$GITHUB_SHA" | python3 .github/scripts/next_release_version.py --existing)
          if [ -z "$tag" ]; then
            tag=$(git tag --list 'v*' | python3 .github/scripts/next_release_version.py)
          fi
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
          git fetch origin tag "$tag"
          test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    permissions:
      contents: read
      packages: write
    # A GITHUB_TOKEN-created tag does not trigger release.yml's push event.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
