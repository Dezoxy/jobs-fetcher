<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Architecture viewer</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; background: #fafbfc; }
      header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #e3e7ec; }
      header h1 { font-size: 18px; margin: 0; }
      header p { margin: 0; color: #5b6573; font-size: 14px; flex: 1; }
      #step { color: #e8590c; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 6em; }
      #stage { overflow: hidden; padding: 16px; min-height: 0; }
      #stage svg, #stage canvas { display: block; width: 100%; height: calc(100vh - 90px); }
      #modes { display: inline-flex; border: 1px solid #c9d2de; border-radius: 6px; overflow: hidden; }
      #modes button { border: 0; background: #fff; padding: 4px 10px; cursor: pointer; }
      #modes button[aria-pressed='true'] { background: #1f2937; color: #fff; }
    </style>
  </head>
  <body>
    <header>
      <button id="prev" title="Previous step or view (←)">←</button>
      <select id="view" aria-label="View"></select>
      <button id="next" title="Next step or view (→)">→</button>
      <span id="step"></span>
      <span id="modes" role="group" aria-label="Mode (m)">
        <button data-mode="2d">2D</button><button data-mode="2.5d">2.5D</button><button data-mode="3d">3D</button>
      </span>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </header>
    <main id="stage">Loading…</main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
